# Compila CipherVault y sube los archivos a un release de GitHub.
#
# Se ejecuta solo al PUBLICAR un release (también si es pre-release) y sube:
#   - CipherVault-Setup.exe        instalador de Windows (build.ps1 + Inno Setup)
#   - CipherVault-portable.exe     la app sin instalador
#   - CipherVault-extension.zip    la extensión del navegador
#   - CipherVault-macOS.zip        la app de macOS (CipherVault.app)
# También se puede lanzar a mano: Actions → Release → Run workflow (con la etiqueta).
#
# Secretos necesarios (Settings → Secrets and variables → Actions → New repository secret):
#   CIPHERVAULT_ACTIVATION_URL      (el mismo valor del .env)
#   CIPHERVAULT_ACTIVATION_SECRET   (el mismo valor del .env)
# Opcional: CIPHERVAULT_EXTENSION_IDS
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de un release que ya existe (por ejemplo v3.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Revisar secretos
        shell: pwsh
        env:
          URL: ${{ secrets.CIPHERVAULT_ACTIVATION_URL }}
          SECRET: ${{ secrets.CIPHERVAULT_ACTIVATION_SECRET }}
        run: |
          if (-not $env:URL -or -not $env:SECRET) {
            throw "Faltan los secretos CIPHERVAULT_ACTIVATION_URL / CIPHERVAULT_ACTIVATION_SECRET."
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar (build.ps1)
        shell: pwsh
        env:
          CIPHERVAULT_ACTIVATION_URL: ${{ secrets.CIPHERVAULT_ACTIVATION_URL }}
          CIPHERVAULT_ACTIVATION_SECRET: ${{ secrets.CIPHERVAULT_ACTIVATION_SECRET }}
          CIPHERVAULT_EXTENSION_IDS: ${{ secrets.CIPHERVAULT_EXTENSION_IDS }}
        run: .\build.ps1
      - name: Subir al release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist -Filter "CipherVault-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "No se genero el instalador." }
          Copy-Item $setup.FullName dist\CipherVault-Setup.exe
          Copy-Item dist\CipherVault.exe dist\CipherVault-portable.exe
          $files = @("dist\CipherVault-Setup.exe", "dist\CipherVault-portable.exe")
          if (Test-Path dist\CipherVault-extension.zip) { $files += "dist\CipherVault-extension.zip" }
          gh release upload $env:TAG @files --clobber --repo $env:GITHUB_REPOSITORY

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=44,<51" "pyinstaller>=6.14,<7" pillow
      - name: Configuración embebida (sin claves de desarrollador)
        env:
          CIPHERVAULT_ACTIVATION_URL: ${{ secrets.CIPHERVAULT_ACTIVATION_URL }}
          CIPHERVAULT_ACTIVATION_SECRET: ${{ secrets.CIPHERVAULT_ACTIVATION_SECRET }}
          CIPHERVAULT_EXTENSION_IDS: ${{ secrets.CIPHERVAULT_EXTENSION_IDS }}
        run: |
          if [ -z "$CIPHERVAULT_ACTIVATION_URL" ] || [ -z "$CIPHERVAULT_ACTIVATION_SECRET" ]; then
            echo "::error::Faltan los secretos CIPHERVAULT_ACTIVATION_URL / CIPHERVAULT_ACTIVATION_SECRET."
            exit 1
          fi
          python - <<'PY'
          import json, os
          keys = ["CIPHERVAULT_ACTIVATION_URL", "CIPHERVAULT_ACTIVATION_SECRET", "CIPHERVAULT_EXTENSION_IDS"]
          with open("desktop_runtime_config.json", "w", encoding="utf-8") as f:
              json.dump({k: os.environ.get(k, "") for k in keys}, f, indent=2)
          PY
      - name: Compilar CipherVault.app
        run: python -m PyInstaller --clean --noconfirm CipherVault-mac.spec
      - name: Empaquetar y subir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/CipherVault.app CipherVault-macOS.zip
          gh release upload "$TAG" CipherVault-macOS.zip --clobber --repo "$GITHUB_REPOSITORY"
