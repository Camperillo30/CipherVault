# Compila CipherVault y sube los archivos a un release de GitHub.
#
# Se ejecuta al subir una etiqueta desde PyCharm (Git > New Tag "v3.2.0" y Push con "Push tags"),
# al PUBLICAR un release desde la web de GitHub (también si es pre-release) o a mano, y sube:
#   - CipherVault-Setup.exe        instalador de Windows (build.ps1 + Inno Setup)
#   - CipherVault-portable.exe     la app sin instalador
#   - CipherVault-macOS.zip        la app de macOS (CipherVault.app)
# Con etiqueta: tiene que coincidir con APP_VERSION de Gestor_contrasenas_secure.py. "v3.2.0" crea
# una versión definitiva; "v3.2.0-beta" (con guion), una pre-release.
# También se puede lanzar a mano: Actions → Release → Run workflow (con la etiqueta de un release).
#
# Secretos necesarios (Settings → Secrets and variables → Actions → New repository secret):
#   CIPHERVAULT_ACTIVATION_URL      (el mismo valor del .env)
#   CIPHERVAULT_ACTIVATION_SECRET   (el mismo valor del .env)
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de un release que ya existe (por ejemplo v3.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  # Con una etiqueta subida desde PyCharm: comprueba la versión y crea el release (los demás jobs
  # le suben los archivos). Si el release ya existía (se publicó desde la web), no hace nada: esa
  # publicación ya lanzó este mismo flujo.
  preparar:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.p.outputs.seguir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then echo "seguir=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          APP_VERSION="$(sed -n 's/^APP_VERSION *= *"\([^"]*\)".*/\1/p' Gestor_contrasenas_secure.py | head -1)"
          BASE="${TAG#v}"; BASE="${BASE%%-*}"
          if [ -z "$APP_VERSION" ] || [ "$BASE" != "$APP_VERSION" ]; then
            echo "::error::La etiqueta $TAG no coincide con APP_VERSION = $APP_VERSION en Gestor_contrasenas_secure.py. Corrige una de las dos, borra la etiqueta y vuelve a crearla."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "El release $TAG ya existe (se publicó desde la web): ese evento ya compila y sube los archivos."
            echo "seguir=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TAG" in *-*) FLAG=--prerelease ;; *) FLAG=--latest ;; esac
          VERSION="${TAG#v}"
          {
            echo "## Descargar CipherVault $VERSION"
            echo
            echo "| Sistema | Archivo |"
            echo "| --- | --- |"
            echo "| **Windows 10 u 11** (instalador) | \`CipherVault-Setup.exe\` |"
            echo "| Windows sin instalar | \`CipherVault-portable.exe\` |"
            echo "| **Mac** (macOS 11 o superior, chip Apple M1 o más nuevo) | \`CipherVault-macOS.zip\` |"
            echo
            echo "Los archivos aparecen aquí unos minutos después de publicar, cuando GitHub termina de compilarlos."
            echo
            echo "### Novedades"
            echo
            echo "- (escribe aquí los cambios de esta versión)"
          } > notas.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "CipherVault $VERSION" --notes-file notas.md "$FLAG"
          echo "seguir=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: preparar
    if: needs.preparar.outputs.seguir == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      - name: Revisar secretos
        shell: pwsh
        env:
          URL: ${{ secrets.CIPHERVAULT_ACTIVATION_URL }}
          SECRET: ${{ secrets.CIPHERVAULT_ACTIVATION_SECRET }}
        run: |
          if (-not $env:URL -or -not $env:SECRET) {
            throw "Faltan los secretos CIPHERVAULT_ACTIVATION_URL / CIPHERVAULT_ACTIVATION_SECRET."
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar (build.ps1)
        shell: pwsh
        env:
          CIPHERVAULT_ACTIVATION_URL: ${{ secrets.CIPHERVAULT_ACTIVATION_URL }}
          CIPHERVAULT_ACTIVATION_SECRET: ${{ secrets.CIPHERVAULT_ACTIVATION_SECRET }}
        run: .\build.ps1
      - name: Subir al release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist -Filter "CipherVault-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "No se genero el instalador." }
          Copy-Item $setup.FullName dist\CipherVault-Setup.exe
          Copy-Item dist\CipherVault.exe dist\CipherVault-portable.exe
          $files = @("dist\CipherVault-Setup.exe", "dist\CipherVault-portable.exe")
          gh release upload $env:TAG @files --clobber --repo $env:GITHUB_REPOSITORY

  macos:
    needs: preparar
    if: needs.preparar.outputs.seguir == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=44,<51" "pyinstaller>=6.14,<7" pillow
      - name: Configuración embebida (sin claves de desarrollador)
        env:
          CIPHERVAULT_ACTIVATION_URL: ${{ secrets.CIPHERVAULT_ACTIVATION_URL }}
          CIPHERVAULT_ACTIVATION_SECRET: ${{ secrets.CIPHERVAULT_ACTIVATION_SECRET }}
        run: |
          if [ -z "$CIPHERVAULT_ACTIVATION_URL" ] || [ -z "$CIPHERVAULT_ACTIVATION_SECRET" ]; then
            echo "::error::Faltan los secretos CIPHERVAULT_ACTIVATION_URL / CIPHERVAULT_ACTIVATION_SECRET."
            exit 1
          fi
          python - <<'PY'
          import json, os
          keys = ["CIPHERVAULT_ACTIVATION_URL", "CIPHERVAULT_ACTIVATION_SECRET"]
          with open("desktop_runtime_config.json", "w", encoding="utf-8") as f:
              json.dump({k: os.environ.get(k, "") for k in keys}, f, indent=2)
          PY
      - name: Compilar CipherVault.app
        run: python -m PyInstaller --clean --noconfirm CipherVault-mac.spec
      - name: Empaquetar y subir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/CipherVault.app CipherVault-macOS.zip
          gh release upload "$TAG" CipherVault-macOS.zip --clobber --repo "$GITHUB_REPOSITORY"
