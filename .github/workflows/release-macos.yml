# Compila CipherVault para macOS (Apple Silicon: M1, M2, M3, M4…) cada vez que se publica
# un release en GitHub, y sube CipherVault-macOS.zip a ese mismo release.
#
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   CIPHERVAULT_ACTIVATION_URL      (el mismo valor del .env)
#   CIPHERVAULT_ACTIVATION_SECRET   (el mismo valor del .env)
# Opcional: CIPHERVAULT_EXTENSION_IDS
name: Release macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release al que se sube el .zip (por ejemplo v3.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=44,<51" "pyinstaller>=6.14,<7" pillow

      - name: Configuración embebida (sin claves de desarrollador)
        env:
          CIPHERVAULT_ACTIVATION_URL: ${{ secrets.CIPHERVAULT_ACTIVATION_URL }}
          CIPHERVAULT_ACTIVATION_SECRET: ${{ secrets.CIPHERVAULT_ACTIVATION_SECRET }}
          CIPHERVAULT_EXTENSION_IDS: ${{ secrets.CIPHERVAULT_EXTENSION_IDS }}
        run: |
          if [ -z "$CIPHERVAULT_ACTIVATION_URL" ] || [ -z "$CIPHERVAULT_ACTIVATION_SECRET" ]; then
            echo "::error::Faltan los secretos CIPHERVAULT_ACTIVATION_URL / CIPHERVAULT_ACTIVATION_SECRET en GitHub."
            exit 1
          fi
          python - <<'PY'
          import json, os
          keys = ["CIPHERVAULT_ACTIVATION_URL", "CIPHERVAULT_ACTIVATION_SECRET", "CIPHERVAULT_EXTENSION_IDS"]
          config = {k: os.environ.get(k, "") for k in keys}
          with open("desktop_runtime_config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
          PY

      - name: Compilar CipherVault.app
        run: python -m PyInstaller --clean --noconfirm CipherVault-mac.spec

      - name: Empaquetar
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/CipherVault.app CipherVault-macOS.zip
          shasum -a 256 CipherVault-macOS.zip

      - name: Subir al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" CipherVault-macOS.zip --clobber --repo "$GITHUB_REPOSITORY"
